[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbox-backend"
version = "0.1.0"
description = "Backend for Scientific Computing Chatbox — DFT, DeePMD Training, LAMMPS MD, Analysis"
requires-python = ">=3.10"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # --- Agent orchestration ---
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",

    # --- Storage backends ---
    "chromadb>=0.5.0",
    "kuzu>=0.4.0",
    "sqlalchemy>=2.0.28",

    # --- Scientific computing ---
    "ase>=3.22.1",
    "numpy>=1.26.4",
    "matplotlib>=3.8.3",
    "pandas>=2.2.1",

    # --- HPC / SSH ---
    "paramiko>=3.4.0",

    # --- HTTP client ---
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = [
    "backend",
    "backend.agents",
    "backend.db",
    "backend.rag",
    "backend.sandbox",
    "backend.tools",
]

[tool.setuptools.package-dir]
backend = "."
